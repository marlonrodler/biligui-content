name: asr-bench
# Teste do reconhecimento em português por tamanho de modelo (só roda quando chamado)
on: workflow_dispatch
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install faster-whisper numpy
      - run: python -u pipeline/asr_bench.py packs/ngsl-spoken 150
